<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contenedor 40' High Cube · LogiLab SENA</title><style>

}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(820px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.lg-back{display:inline-block;margin:0 0 14px;font:12.5px/1.3 ui-sans-serif,system-ui,sans-serif;color:var(--anatomy-muted);text-decoration:none}.lg-back:hover,.lg-back:focus-visible{color:var(--anatomy-strong)}</style><a class="lg-back" href="../">← Equipos 3D · LogiLab SENA</a><style>.aq {
  --aq-water: #3f7f9a;
  --aq-water-a: 0.13;
  --aq-surface-a: 0.2;
  --aq-glass: #9fc4d2;
  --aq-glass-a: 0.07;
  --aq-bubble: var(--anatomy-hi);
  --aq-part-ring: #ffffff14;
  --aq-part-hover: #ffffff0d;
}
.iso[data-theme="light"] .aq {
  --aq-water: #4f93ad;
  --aq-water-a: 0.16;
  --aq-surface-a: 0.22;
  --aq-glass: #7fb3c6;
  --aq-glass-a: 0.08;
  --aq-part-ring: #0000001a;
  --aq-part-hover: #0000000a;
}

.aq-stage {
  position: relative;
  outline: none;
  touch-action: pan-y;
}

.aq-water {
  fill: var(--aq-water);
  fill-opacity: var(--aq-water-a);
  stroke: none;
}
.iso[data-theme="light"] .aq-water {
  mix-blend-mode: multiply;
}
.aq-surface {
  fill-opacity: var(--aq-surface-a);
}

/* El vidrio no tapa lo que hay detrás: sólo un velo y sus cantos. */
.aq-glass .iso-fill {
  fill: var(--aq-glass);
  fill-opacity: var(--aq-glass-a);
}
.aq-glass .iso-shade {
  fill: none;
}
.aq-glass .iso-top {
  fill: var(--anatomy-shade-1);
}

.aq-fall {
  animation: aq-flow 0.9s linear infinite;
}
.aq-ripple {
  animation: aq-shimmer 4s ease-in-out infinite;
}
@keyframes aq-flow {
  to {
    stroke-dashoffset: -8;
  }
}
@keyframes aq-shimmer {
  50% {
    opacity: 0.45;
  }
}

.aq-bubbles circle {
  fill: none;
  stroke: var(--aq-bubble);
  stroke-width: 0.5;
  vector-effect: non-scaling-stroke;
}

[data-lamp] circle {
  transition: opacity 300ms var(--anatomy-ease);
}
.aq-stage[data-heat] [data-lamp] circle {
  fill: var(--anatomy-lit);
  opacity: 1;
}

/* Selección: la pieza elegida pasa a ser el acento; lo demás baja un tono. */
.aq-stage[data-focus] .it:not([data-on]) {
  --anatomy-hi: var(--anatomy-mid);
  --anatomy-mid: var(--anatomy-lo);
}
.it[data-on] {
  --anatomy-hi: var(--anatomy-lit);
  --anatomy-mid: var(--anatomy-hi);
}
.it[data-on] .iso-top,
.it[data-on] .tb-shine {
  fill: var(--anatomy-lit-top);
}
.it[data-on] .iso-shade,
.it[data-on] .tb-body {
  fill: var(--anatomy-lit-shade);
}
.it[data-on] .aq-glass .iso-shade {
  fill: none;
}

.aq-parts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}
.aq-part {
  display: inline-flex;
  align-items: baseline;
  gap: 7px;
  padding: 5px 10px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--anatomy-muted);
  font: 12.5px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--aq-part-ring);
  transition: color 160ms var(--anatomy-ease), background 160ms var(--anatomy-ease);
}
.aq-part:hover,
.aq-part:focus-visible,
.aq-part[data-on] {
  color: var(--anatomy-strong);
  background: var(--aq-part-hover);
  outline: none;
}
.aq-num {
  font-family: var(--anatomy-mono);
  font-size: 10px;
  color: var(--anatomy-muted);
}
.aq-credit {
  margin: 14px 0 0;
  font-size: 11px;
  color: var(--anatomy-muted);
}

@media (max-width: 640px) {
  .aq .iso-plate {
    padding-bottom: 92px;
  }
  .aq .iso-plate-corner[data-corner="readout"] {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .aq .iso-plate-corner[data-corner="hint"] {
    bottom: 48px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .aq-fall,
  .aq-ripple {
    animation: none;
  }
}

/* Zoom */
.aq-stage[data-zoomed] {
  touch-action: none;
  cursor: grab;
}
.aq-stage[data-zoomed]:active {
  cursor: grabbing;
}
.aq-stage svg {
  user-select: none;
  -webkit-user-select: none;
}
.zm-bar {
  position: absolute;
  top: 6px;
  right: 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 2;
}
.zm-btn {
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 10px;
  background: var(--anatomy-card);
  color: var(--anatomy-strong);
  font: 18px/1 var(--anatomy-mono);
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--aq-part-ring), var(--anatomy-lift);
  transition: background 160ms var(--anatomy-ease), opacity 160ms var(--anatomy-ease);
}
.zm-btn:hover,
.zm-btn:focus-visible {
  background: var(--aq-part-hover);
  outline: none;
}
.zm-btn:disabled {
  opacity: 0.35;
  cursor: default;
}
.aq-stage[data-zoomed] {
  overflow: hidden;
  border-radius: 8px;
}
.aq-stage[data-zoomed] .iso-svg {
  overflow: hidden;
}

 300.4L368.7 300.2L369.1 300.1L369.5 300.0L369.9 299.9L370.2 299.9L370.5 300.0L370.7 300.1L370.8 300.2L370.8 300.4L370.7 300.5L370.4 300.7L370.1 300.8ZM368.2 303.0L368.2 302.8L368.1 302.5L367.9 302.3L367.8 302.1L367.6 301.9L367.4 301.8L367.2 301.7L367.1 301.8L367.0 301.9L367.0 302.1L367.0 302.4L367.1 302.6L367.2 302.9L367.4 303.1L367.6 303.3L367.8 303.4L367.9 303.4L368.1 303.4L368.2 303.2L368.2 303.0ZM370.1 303.3L370.1 303.1L370.3 302.9L370.5 302.6L370.7 302.5L371.0 302.3L371.3 302.3L371.5 302.3L371.7 302.4L371.9 302.5L371.9 302.7L371.9 303.0L371.7 303.2L371.5 303.4L371.3 303.6L371.0 303.7L370.7 303.8L370.5 303.8L370.3 303.7L370.1 303.5L370.1 303.3Z"/></g></g></svg></div></div><figcaption class="iso-legend"><span class="aq-parts"><button type="button" class="aq-part" data-part="roof">Techo y rieles superiores</button><button type="button" class="aq-part" data-part="wall">Paredes laterales corrugadas</button><button type="button" class="aq-part" data-part="doors">Puertas y cierres</button><button type="button" class="aq-part" data-part="castings">Esquineros ISO</button><button type="button" class="aq-part" data-part="frame">Postes y rieles inferiores</button><button type="button" class="aq-part" data-part="floor">Piso de madera</button><button type="button" class="aq-part" data-part="front">Pared frontal</button><button type="button" class="aq-part" data-part="cargo">Carga paletizada</button></span><span class="iso-caption">Un 40' High Cube (código ISO 45G1) mide 12,192 × 2,438 × 2,896 m por fuera y 12,032 × 2,352 × 2,698 m por dentro: 76,4 m³. Es 30 cm más alto que un 40' estándar. Pesa unos 3.900 kg vacío y puede llegar a 30.480 kg, así que acepta unos 26.580 kg de carga. Todo el peso baja por los cuatro postes hasta los ocho esquineros, que es por donde la grúa lo levanta y por donde se apila hasta nueve alto en un buque. Las paredes no cargan: su chapa corrugada sólo las hace rígidas.</span></figcaption><p class="aq-credit">LogiLab SENA · By Carlos Barrios · Instructor · figura hecha con Anatomy (wheresryan22, MIT)</p></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();

    view.cx += (target.cx - view.cx) * k;
    view.cy += (target.cy - view.cy) * k;
    const done = Math.abs(target.z - view.z) < 0.002 && Math.abs(target.cx - view.cx) < 0.05 && Math.abs(target.cy - view.cy) < 0.05;
    if (done) Object.assign(view, target);
    apply();
    raf = done ? 0 : requestAnimationFrame(animate);
  };
  const go = () => {
    clampView(target);
    if (!raf) raf = requestAnimationFrame(animate);
  };
  // Punto del viewBox bajo una posición de pantalla, con la vista actual.
  const toView = (clientX, clientY) => {
    const box = svgEl.getBoundingClientRect();
    const w = VW / view.z;
    const h = VH / view.z;
    return [view.cx - w / 2 + ((clientX - box.left) / box.width) * w, view.cy - h / 2 + ((clientY - box.top) / box.height) * h];
  };
  // Acerca manteniendo fijo el punto bajo el cursor o el dedo.
  const zoomAt = (factor, clientX, clientY) => {
    const box = svgEl.getBoundingClientRect();
    const fx = clientX === undefined ? 0.5 : (clientX - box.left) / box.width;
    const fy = clientY === undefined ? 0.5 : (clientY - box.top) / box.height;
    const w = VW / target.z;
    const h = VH / target.z;
    const px = target.cx - w / 2 + fx * w;
    const py = target.cy - h / 2 + fy * h;
    target.z = Math.min(MAX, Math.max(1, target.z * factor));
    const nw = VW / target.z;
    const nh = VH / target.z;
    target.cx = px - fx * nw + nw / 2;
    target.cy = py - fy * nh + nh / 2;
    takeOver();
    go();
  };

  bar.addEventListener("pointerdown", (event) => event.stopPropagation());
  bar.addEventListener("pointerenter", (event) => event.stopPropagation());
  bar.addEventListener("click", (event) => {
    const button = event.target.closest("[data-zoom]");
    if (!button) return;
    event.stopPropagation();
    if (button.dataset.zoom === "in") zoomAt(1.6);
    if (button.dataset.zoom === "out") zoomAt(1 / 1.6);
    if (button.dataset.zoom === "reset") {
      Object.assign(target, { z: 1, cx: VW / 2, cy: VH / 2 });
      go();
    }
  });

  stage.addEventListener(
    "wheel",
    (event) => {
      event.preventDefault();
      zoomAt(Math.exp(-event.deltaY * 0.0022), event.clientX, event.clientY);
    },
    { passive: false },
  );
  stage.addEventListener("dblclick", (event) => {
    if (event.target.closest(".zm-bar")) return;
    zoomAt(target.z > 3 ? 1 / target.z : 2, event.clientX, event.clientY);
  });

  // Arrastre (con zoom) y pellizco con dos dedos.
  const touches = new Map();
  let drag = null;
  let pinch = null;
  let lastTap = 0;
  stage.addEventListener("pointerdown", (event) => {
    if (event.target.closest(".zm-bar")) return;
    touches.set(event.pointerId, [event.clientX, event.clientY]);
    if (touches.size === 2) {
      const [a, b] = [...touches.values()];
      pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: target.z };
      drag = null;
    } else if (target.z > 1.01) {
      drag = { x: event.clientX, y: event.clientY, cx: target.cx, cy: target.cy, moved: false };
      stage.setPointerCapture?.(event.pointerId);
    }
    if (event.pointerType === "touch") {
      const now = performance.now();
      if (now - lastTap < 300 && touches.size === 1) zoomAt(target.z > 3 ? 1 / target.z : 2, event.clientX, event.clientY);
      lastTap = now;
    }
  });
  stage.addEventListener("pointermove", (event) => {
    if (!touches.has(event.pointerId)) return;
    touches.set(event.pointerId, [event.clientX, event.clientY]);
    if (pinch && touches.size === 2) {
      const [a, b] = [...touches.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      const want = Math.min(MAX, Math.max(1, (pinch.z * d) / pinch.d));
      zoomAt(want / target.z, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      return;
    }
    if (drag) {
      const box = svgEl.getBoundingClientRect();
      const dx = ((event.clientX - drag.x) / box.width) * (VW / target.z);
      const dy = ((event.clientY - drag.y) / box.height) * (VH / target.z);
      if (Math.abs(event.clientX - drag.x) + Math.abs(event.clientY - drag.y) > 4) drag.moved = true;
      target.cx = drag.cx - dx;
      target.cy = drag.cy - dy;
      go();
    }
  });
  const end = (event) => {
    touches.delete(event.pointerId);
    if (touches.size < 2) pinch = null;
    if (touches.size === 0) drag = null;
  };
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointercancel", end);

  stage.addEventListener("keydown", (event) => {
    if (event.key === "+" || event.key === "=") zoomAt(1.6);
    else if (event.key === "-") zoomAt(1 / 1.6);
    else if (event.key === "0") {
      Object.assign(target, { z: 1, cx: VW / 2, cy: VH / 2 });
      go();
    } else return;
    event.preventDefault();
  });
  apply();
})();
</script></body></html>
